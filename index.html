<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeFactory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%2212%22 width=%2220%22 height=%2216%22 rx=%224%22 fill=%22%23ff8fb3%22/%3E%3Crect x=%2210%22 y=%224%22 width=%2220%22 height=%2216%22 rx=%224%22 fill=%22%238fb4f0%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: two-pane workbench — the factory floor on the left, the code console on the right; stacks on phones.
   One deliberate visual world: a pastel toy factory under neon light, so the page stays light on any host. */
:root{
  --bg:#eceffb; --bg-2:#f6f2ff; --panel:#ffffff; --ink:#2b2e57; --muted:#6c7099; --line:#dde1f3;
  --pink:#ff8fb3; --cyan:#62cdef; --lav:#b9a3ef; --mint:#86d9b3; --butter:#f4cf72; --sky:#8fb4f0;
  --code-bg:#272b52; --code-bg-2:#20244a; --code-ink:#e9ebff; --code-muted:#7f84b8; --code-line:#343964;
  --err:#e2546f; --ok:#2e9f76;
  --f-display:'Unbounded','Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-code:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column;padding-inline:16px;gap:12px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;flex:none;position:relative}
.logo i{position:absolute;border-radius:5px}
.logo i:nth-child(1){left:0;top:14px;width:26px;height:20px;background:var(--pink)}
.logo i:nth-child(2){left:14px;top:4px;width:26px;height:20px;background:var(--sky);mix-blend-mode:multiply}
.logo i:nth-child(3){left:20px;top:0;width:6px;height:5px;background:var(--sky);border-radius:2px 2px 0 0}
.logo i:nth-child(4){left:30px;top:0;width:6px;height:5px;background:var(--sky);border-radius:2px 2px 0 0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand h1 b{color:var(--pink);font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lv{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:5px 10px 4px;min-width:62px;
  display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1;transition:transform .15s,border-color .15s}
.lv:hover{transform:translateY(-2px);border-color:var(--lav)}
.lv .n{font-family:var(--f-display);font-weight:700;font-size:15px}
.lv .s{font-size:11px;letter-spacing:1px;color:#d5d8ec}
.lv .s em{font-style:normal;color:var(--butter)}
.lv[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.lv[aria-current="true"] .s{color:#5d628f}
.sound{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px}
.sound[aria-pressed="false"]{color:var(--muted)}

/* main layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);gap:14px}
.stage{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.stage-card{position:relative;flex:1;min-height:320px;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#e3e7fb 0%,#f3eefc 100%);box-shadow:0 1px 0 #fff inset,0 10px 30px -18px #6c70a0}
#scene,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene{pointer-events:none}
.hud{position:absolute;left:14px;top:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pill{background:rgba(255,255,255,.82);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;
  box-shadow:0 2px 10px -6px #6c70a0}
.pill.topic{color:#7d5fd6}
.pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:6px;vertical-align:1px}
.pill.running .dot{background:var(--pink);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(236,239,251,.55);backdrop-filter:blur(3px)}
.result-card{background:var(--panel);border-radius:22px;padding:24px 28px;text-align:center;max-width:min(380px,90%);
  box-shadow:0 20px 50px -20px #5b5f99;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.result-card h3{font-family:var(--f-display);font-size:22px;margin:0 0 4px}
.result-card p{margin:0 0 12px;color:var(--muted)}
.big-stars{font-size:42px;letter-spacing:6px;color:#e4e6f3;margin:4px 0 8px}
.big-stars span{display:inline-block}
.big-stars .on{color:var(--butter);animation:starIn .5s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 3px 0 #e2b54f}
.big-stars .on:nth-child(2){animation-delay:.15s}.big-stars .on:nth-child(3){animation-delay:.3s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.crit{list-style:none;padding:0;margin:0 0 16px;text-align:left;font-size:14px;display:grid;gap:4px}
.crit li{display:flex;gap:8px;align-items:baseline}
.crit li::before{content:"★";color:#d9dcef}
.crit li.on::before{color:var(--butter)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* brief */
.brief{background:var(--panel);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;
  box-shadow:0 1px 0 var(--line)}
.brief h2{font-family:var(--f-display);font-size:18px;margin:0;text-wrap:balance;font-weight:700}
.brief h2 small{font-family:var(--f-body);font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.brief .story{grid-column:1/-1;margin:0;color:#41456f;max-width:75ch}
.brief .goals{grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}
.brief .goals span::before{content:"★ ";color:var(--butter)}
.hint{grid-column:1/-1;background:#fff8e3;border-radius:10px;padding:10px 12px;margin:0;font-size:14px;color:#6a5521}
.brief-actions{display:flex;gap:6px;align-items:start}

.btn{border:0;border-radius:11px;padding:9px 14px;font-weight:800;font-size:14px;background:#eef0fa;color:var(--ink);
  display:inline-flex;align-items:center;gap:7px;transition:transform .1s,background .15s;white-space:nowrap}
.btn:hover{background:#e3e6f7}
.btn:active{transform:translateY(1px)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#3a3e72}
.btn.go{background:var(--pink);color:#3b1630;box-shadow:0 3px 0 #e06c94}
.btn.go:hover{background:#ff9fbe}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;fill:currentColor}

/* coder */
.coder{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.tabs{display:flex;gap:4px;background:#e1e4f6;padding:4px;border-radius:12px;align-self:flex-start}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:9px;font-weight:800;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px -2px #6c70a0}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}

/* editor */
.editor{flex:1;min-height:220px;display:flex;background:var(--code-bg);border-radius:var(--r);overflow:hidden;position:relative;
  font-family:var(--f-code);font-size:14px;line-height:22px}
.gutter{flex:none;width:42px;padding:12px 0;background:var(--code-bg-2);color:var(--code-muted);text-align:right;overflow:hidden;user-select:none}
.gutter-in div{padding-right:10px;height:22px}
.gutter-in div.cur{color:var(--pink);font-weight:600}
.gutter-in div.bad{color:#fff;background:var(--err)}
.code-wrap{position:relative;flex:1;min-width:0;overflow:hidden}
.code-wrap pre,.code-wrap textarea{margin:0;padding:12px 14px;font:inherit;line-height:inherit;white-space:pre;tab-size:4;border:0;
  position:absolute;inset:0;overflow:hidden;letter-spacing:0}
.code-wrap pre{color:var(--code-ink);pointer-events:none}
.code-wrap pre code{display:block;font:inherit}
.code-wrap textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;overflow:auto;width:100%;height:100%}
.code-wrap textarea::selection{background:rgba(255,143,179,.35)}
.lnmark{position:absolute;left:0;right:0;height:22px;pointer-events:none;background:rgba(98,205,239,.14);box-shadow:inset 3px 0 0 var(--cyan);display:none}
.lnmark.bad{background:rgba(226,84,111,.22);box-shadow:inset 3px 0 0 var(--err)}
.t-kw{color:#ff9fc2;font-weight:600}.t-con{color:#ffb98a}.t-str{color:#a9e8c5}.t-num{color:#ffd58a}.t-com{color:var(--code-muted);font-style:italic}
.t-fn{color:#8fd6ff;font-weight:600}.t-bi{color:#c9b6ff}

/* blocks */
.blocks{flex:1;min-height:260px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
.palette{background:var(--panel);border-radius:var(--r);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.palette h4{margin:6px 2px 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.palette .pb{border:0;text-align:left;border-radius:9px;padding:6px 9px;font-weight:800;font-size:13px;cursor:grab;line-height:1.2}
.workspace{background:#f8f9fe;border:2px dashed var(--line);border-radius:var(--r);padding:10px;overflow:auto;position:relative}
.slot{min-height:34px;display:flex;flex-direction:column;gap:5px;border-radius:9px;padding:3px}
.slot.active{background:rgba(98,205,239,.12);box-shadow:inset 0 0 0 2px rgba(98,205,239,.5)}
.slot-hint{font-size:12px;color:#a2a6c7;font-weight:700;padding:4px 6px}
.blk{border-radius:10px;font-weight:800;font-size:13.5px;box-shadow:0 2px 0 rgba(43,46,87,.18)}
.blk-head{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap;cursor:grab}
.blk-head input,.blk-head select{border:0;border-radius:6px;padding:2px 5px;font-weight:800;background:rgba(255,255,255,.75);font-size:13px}
.blk-head input[type=number]{width:46px}
.blk-head input[type=text]{width:90px;font-family:var(--f-code)}
.blk .x{margin-left:auto;border:0;background:rgba(255,255,255,.5);border-radius:6px;width:22px;height:22px;line-height:1;font-weight:800;padding:0}
.blk .x:hover{background:#fff}
.blk .inner{margin:0 6px 6px 16px;background:rgba(255,255,255,.55);border-radius:8px}
.blk .else-head{padding:2px 8px 4px;font-size:13px}
.blk.running{outline:3px solid var(--ink);outline-offset:1px}
.blk.dragging{opacity:.4}
.cat-move{background:#a9c7f6}.cat-act{background:#f8b5c7}.cat-ctrl{background:#f7d98c}.cat-func{background:#cdbcf5}.cat-var{background:#a3e3c5}
.drop-line{position:absolute;height:3px;background:var(--pink);border-radius:2px;pointer-events:none;display:none}
.blk-foot{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.preview{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);padding:10px 12px;font-family:var(--f-code);font-size:12.5px;
  line-height:19px;max-height:150px;overflow:auto;white-space:pre}

/* controls + console */
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.speed{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.speed input{width:90px;accent-color:var(--pink)}
.console{background:var(--panel);border-radius:var(--r);height:118px;overflow:auto;padding:8px 12px;font-family:var(--f-code);font-size:12.5px;line-height:1.55}
.console div{white-space:pre-wrap;word-break:break-word}
.c-info{color:var(--muted)}.c-out{color:var(--ink)}.c-err{color:var(--err);font-weight:600}.c-ok{color:var(--ok);font-weight:600}
.ref{background:var(--panel);border-radius:var(--r);padding:8px 12px;font-size:13.5px}
.ref summary{font-weight:800;cursor:pointer}
.ref dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:8px 0 2px}
.ref dt{font-family:var(--f-code);font-size:12.5px;color:#4a68b8;font-weight:600}
.ref dd{margin:0;color:#41456f}

@media (max-width:980px){
  #app{height:auto;min-height:100%}
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage-card{flex:none;height:min(72vw,480px);min-height:280px}
  .editor{min-height:300px}
  .levels{margin-left:0}
}
@media (max-width:520px){
  .blocks{grid-template-columns:minmax(0,1fr)}
  .palette{flex-direction:row;flex-wrap:wrap;max-height:140px}
  .palette h4{width:100%}
  .brief{grid-template-columns:minmax(0,1fr)}
  .speed{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div><h1>Code<b>Factory</b></h1><p>Роботтар фабрикасы</p></div>
    </div>
    <nav class="levels" id="levelNav" aria-label="Деңгейлер"></nav>
    <button class="sound" id="gfxBtn" title="Әлсіз компьютерде 2D режимін таңда">Графика: 3D</button>
    <button class="sound" id="soundBtn" aria-pressed="true">Дыбыс: қосулы</button>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="stage-card">
        <canvas id="gl" aria-label="Фабрика алаңы: робот бағдарлама бойынша қозғалады"></canvas>
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="hud">
          <span class="pill topic" id="hudTopic"></span>
          <span class="pill" id="hudState"><span class="dot"></span><span id="hudStateText">Дайын</span></span>
          <span class="pill" id="hudProgress"></span>
        </div>
        <div class="result" id="result" hidden>
          <div class="result-card" role="dialog" aria-labelledby="resTitle">
            <h3 id="resTitle">Деңгей өтілді!</h3>
            <div class="big-stars" id="resStars"></div>
            <ul class="crit" id="resCrit"></ul>
            <div class="row">
              <button class="btn" id="resAgain">Қайта ойнау</button>
              <button class="btn go" id="resNext">Келесі деңгей →</button>
            </div>
          </div>
        </div>
      </div>
      <div class="brief" id="brief">
        <h2 id="lvTitle"></h2>
        <div class="brief-actions">
          <button class="btn small" id="hintBtn">Кеңес</button>
        </div>
        <p class="story" id="lvStory"></p>
        <div class="goals" id="lvGoals"></div>
        <p class="hint" id="lvHint" hidden></p>
      </div>
    </section>

    <section class="coder">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabPy" aria-selected="true">Python</button>
        <button class="tab" role="tab" id="tabBlk" aria-selected="false">Блоктар</button>
      </div>

      <div class="pane" id="pyPane">
        <div class="editor">
          <div class="gutter"><div class="gutter-in" id="gutter"></div></div>
          <div class="code-wrap">
            <div class="lnmark" id="lnmark"></div>
            <pre aria-hidden="true"><code id="hl"></code></pre>
            <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python коды"></textarea>
          </div>
        </div>
      </div>

      <div class="pane" id="blkPane" hidden>
        <div class="blocks">
          <div class="palette" id="palette" aria-label="Блоктар жинағы"></div>
          <div class="workspace" id="workspace"><div class="drop-line" id="dropLine"></div></div>
        </div>
        <div class="blk-foot">
          <button class="btn small" id="toPython">Python-ға көшіру →</button>
          <button class="btn small" id="clearBlocks">Тазалау</button>
          <span class="c-info" style="font-size:12.5px">Блоктарды сүйреп әкел немесе басып қос</span>
        </div>
        <pre class="preview" id="blkPreview" aria-label="Блоктардан жасалған Python коды"></pre>
      </div>

      <div class="controls">
        <button class="btn go" id="runBtn"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg><span>Іске қосу</span></button>
        <button class="btn" id="stepBtn" title="Бір команданы орындау"><svg viewBox="0 0 16 16"><path d="M2 2l8 6-8 6zM11 2h3v12h-3z"/></svg>Қадам</button>
        <button class="btn" id="stopBtn"><svg viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg>Тоқтату</button>
        <label class="speed" for="speed">Жылдамдық <input type="range" id="speed" min="0" max="4" step="1" value="1"></label>
      </div>
      <div class="console" id="console" aria-live="polite"></div>
      <details class="ref" id="ref"><summary>Командалар анықтамасы</summary><dl id="refList"></dl></details>
    </section>
  </main>
</div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);

/* ================= storage (own key, separate from Pyxel Quest) ================= */
const STORE_KEY = 'cf-progress-v1';
let save = { stars: {}, code: {}, blocks: {}, mode: 'py', level: 0, sound: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch (e) {}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ================= world data ================= */
const COL = {
  red: { kk: 'қызыл', base: '#f49fb4' },
  blue: { kk: 'көк', base: '#93bcf5' },
  green: { kk: 'жасыл', base: '#93dbb6' },
  yellow: { kk: 'сары', base: '#fbdc85' },
};
const PART_KK = { head: 'бас', body: 'дене', battery: 'батарея' };
const rnd = (n) => Math.floor(Math.random() * n);
const brick = (color) => ({ kind: 'brick', color });
const randBricks = (n, colors) => Array.from({ length: n }, () => brick(colors[rnd(colors.length)]));
const bin = (id) => (w) => w.stations.find((s) => s.id === id);
const binsTotal = (w) => w.stations.filter((s) => s.type === 'bin').reduce((a, s) => a + s.items.length, 0);

const SORT_LAYOUT = (extra) => ({
  grid: [8, 6],
  robot: { x: 3, y: 2, dir: 0 },
  decor: [[0, 0, 'stack', 1], [7, 5, 'stack', 2], [0, 5, 'pipe'], [6, 0, 'gearbox'], [1, 5, 'stack', 3]],
  ...extra,
});

const LEVELS = [
  {
    title: 'Алғашқы қадам', topic: 'Командалар тізбегі',

/* ================= Python-subset interpreter ================= */
class PyError extends Error { constructor(msg, line) { super(msg); this.line = line; } }
class RobotError extends Error { constructor(msg) { super(msg); } }
class ReturnSig { constructor(v) { this.value = v; } }
const BREAK = { sig: 'break' }, CONTINUE = { sig: 'continue' };
const KW = new Set(['if', 'elif', 'else', 'while', 'for', 'in', 'def', 'return', 'break', 'continue', 'pass', 'and', 'or', 'not', 'True', 'False', 'None', 'global']);
const OPS2 = ['**', '//', '==', '!=', '<=', '>=', '+=', '-=', '*=', '/=', '%='];

function tokenize(src) {
  const lines = src.replace(/\r/g, '').replace(/[“”«»]/g, '"').replace(/[‘’]/g, "'").split('\n');
  const toks = []; const indents = [0]; let depth = 0;
  const push = (t, v, line) => toks.push({ t, v, line });
  for (let ln = 0; ln < lines.length; ln++) {
    const line = lines[ln].replace(/\t/g, '    ');
    const L = ln + 1; let i = 0;
    if (depth === 0) {
      const ind = line.match(/^ */)[0].length;
      const rest = line.slice(ind);
      if (rest === '' || rest[0] === '#') continue;
      const top = indents[indents.length - 1];
      if (ind > top) { indents.push(ind); push('INDENT', null, L); }
      else if (ind < top) {
        while (ind < indents[indents.length - 1]) { indents.pop(); push('DEDENT', null, L); }
        if (ind !== indents[indents.length - 1]) throw new PyError('Шегініс (бос орындар саны) жоғарыдағы жолдармен сәйкес емес.', L);
      }
      i = ind;
    }
    while (i < line.length) {
      const ch = line[i];
      if (ch === ' ') { i++; continue; }
      if (ch === '#') break;
      const rest = line.slice(i);
      let m;
      if ((m = rest.match(/^(\d+\.\d*|\.\d+|\d+)/))) { push('NUM', parseFloat(m[1]), L); i += m[1].length; continue; }
      if (ch === '"' || ch === "'") {
        let j = i + 1, s = '';
        while (j < line.length && line[j] !== ch) {
          if (line[j] === '\\' && j + 1 < line.length) { const e = line[j + 1]; s += e === 'n' ? '\n' : e === 't' ? '\t' : e; j += 2; }
          else s += line[j++];
        }
        if (j >= line.length) throw new PyError(`Мәтін (string) жабылмаған: соңына ${ch} белгісін қой.`, L);
        push('STR', s, L); i = j + 1; continue;
      }
      if ((m = rest.match(/^[A-Za-z_À-￿][\wÀ-￿]*/))) {
        push(KW.has(m[0]) ? 'KW' : 'NAME', m[0], L); i += m[0].length; continue;
      }
      const two = rest.slice(0, 2);
      if (OPS2.includes(two)) { push('OP', two, L); i += 2; continue; }
      if ('+-*/%<>=()[],:.'.includes(ch)) {
        if (ch === '(' || ch === '[') depth++;
        if (ch === ')' || ch === ']') depth = Math.max(0, depth - 1);
        push('OP', ch, L); i++; continue;
      }
      throw new PyError(`Түсініксіз таңба: «${ch}»`, L);
    }
    if (depth === 0 && toks.length && toks[toks.length - 1].t !== 'NEWLINE' && toks[toks.length - 1].t !== 'INDENT' && toks[toks.length - 1].t !== 'DEDENT') push('NEWLINE', null, L);
  }
  const lastLine = lines.length;
  if (depth > 0) throw new PyError('Жақша жабылмаған: «)» немесе «]» жетіспейді.', lastLine);
  if (toks.length && toks[toks.length - 1].t !== 'NEWLINE') push('NEWLINE', null, lastLine);
  while (indents.length > 1) { indents.pop(); push('DEDENT', null, lastLine); }
  push('EOF', null, lastLine);
  return toks;
}

class Parser {
  constructor(toks) { this.toks = toks; this.p = 0; }
  peek() { return this.toks[this.p]; }
  next() { return this.toks[this.p++]; }
  is(t, v) { const k = this.peek(); return k.t === t && (v === undefined || k.v === v); }
  err(msg, tok) { return new PyError(msg, (tok || this.peek()).line); }
  program() {
    const body = [];
    while (!this.is('EOF')) {
      if (this.is('NEWLINE')) { this.next(); continue; }
      if (this.is('INDENT')) throw this.err('Күтпеген шегініс: бұл жолдың алдындағы бос орындарды алып таста.');
      if (this.is('DEDENT')) { this.next(); continue; }
      body.push(this.statement());
    }
    return body;
  }
  colon() {
    if (this.is('OP', '=')) throw this.err('Салыстыру үшін «==» қолдан, ал «=» тек мән беру үшін.');
    if (!this.is('OP', ':')) throw this.err('Жолдың соңында «:» (қос нүкте) жетіспейді.');
    this.next();
  }
  block() {
    if (this.is('NEWLINE')) {
      this.next();
      if (!this.is('INDENT')) throw this.err('«:» белгісінен кейінгі жолдар шегініспен (4 бос орын) басталуы керек.');
      this.next();
      const body = [];
      while (!this.is('DEDENT') && !this.is('EOF')) {
        if (this.is('NEWLINE')) { this.next(); continue; }
        body.push(this.statement());
      }
      if (this.is('DEDENT')) this.next();
      return body;
    }
    const s = this.simple(); this.endLine(); return [s];
  }
  endLine() {
    if (this.is('NEWLINE')) { this.next(); return; }
    if (this.is('EOF') || this.is('DEDENT')) return;
    throw this.err(`Жолдың соңында артық белгі бар: «${this.peek().v}». Әр команда жаңа жолдан жазылады.`);
  }
  statement() {
    const tk = this.peek(); const line = tk.line;
    if (tk.t === 'KW') {
      switch (tk.v) {
        case 'if': return this.ifStmt();
        case 'while': { this.next(); const test = this.expr(); this.colon(); return { type: 'While', test, body: this.block(), line }; }
        case 'for': {
          this.next();
          if (!this.is('NAME')) throw this.err('for сөзінен кейін айнымалы аты керек, мысалы: for i in range(5):');
          const name = this.next().v;
          if (!this.is('KW', 'in')) throw this.err('«in» сөзі жетіспейді: for i in range(5):');
          this.next(); const iter = this.expr(); this.colon();
          return { type: 'For', name, iter, body: this.block(), line };
        }
        case 'def': {
          this.next();
          if (!this.is('NAME')) throw this.err('def сөзінен кейін функция аты керек, мысалы: def build():');
          const name = this.next().v;
          if (!this.is('OP', '(')) throw this.err(`Функция атынан кейін жақша керек: def ${name}():`);
          this.next(); const params = [];
          while (!this.is('OP', ')')) {
            if (!this.is('NAME')) throw this.err('Параметр аты күтілді.');
            params.push(this.next().v);
            if (this.is('OP', ',')) this.next(); else if (!this.is('OP', ')')) throw this.err('«)» жетіспейді.');
          }
          this.next(); this.colon();
          const body = this.block();
          return { type: 'Def', name, params, body, line, locals: collectLocals(body) };
        }
        case 'elif': case 'else': throw this.err(`«${tk.v}» алдында «if» жоқ немесе шегініс сәйкес емес.`);
      }
    }
    const s = this.simple(); this.endLine(); return s;
  }
  ifStmt() {
    const line = this.next().line; const test = this.expr(); this.colon();
    const body = this.block(); let orelse = [];
    if (this.is('KW', 'elif')) orelse = [this.ifStmt()];
    else if (this.is('KW', 'else')) { this.next(); this.colon(); orelse = this.block(); }
    return { type: 'If', test, body, orelse, line };
  }
  simple() {
    const tk = this.peek(); const line = tk.line;
    if (tk.t === 'KW') {
      if (tk.v === 'pass') { this.next(); return { type: 'Pass', line }; }
      if (tk.v === 'break') { this.next(); return { type: 'Break', line }; }
      if (tk.v === 'continue') { this.next(); return { type: 'Continue', line }; }
      if (tk.v === 'return') {
        this.next();
        const value = (this.is('NEWLINE') || this.is('EOF') || this.is('DEDENT')) ? null : this.expr();
        return { type: 'Return', value, line };
      }

  const p = L.progress(world); const el = $('#hudProgress'); if (el.textContent !== p) el.textContent = p;
  const st = run.active ? (run.paused ? 'Кідіріс' : 'Жұмыс істеп тұр') : 'Дайын';
  if (st !== hudState) { hudState = st; $('#hudStateText').textContent = st; $('#hudState').classList.toggle('running', run.active && !run.paused); }
  if (run.active && run.line) { mode() === 'py' ? setMark(run.line) : markBlock(run.line); }
}
function syncButtons() {
  const rb = $('#runBtn');
  rb.querySelector('span').textContent = run.active ? (run.paused ? 'Жалғастыру' : 'Кідірту') : 'Іске қосу';
  rb.querySelector('svg').innerHTML = run.active && !run.paused ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>';
  $('#stopBtn').disabled = !run.active && !world.robot.alert && !dirtyWorld();
}
function dirtyWorld() { const r = world.robot; return r.x !== L.robot.x || r.y !== L.robot.y || r.dir !== L.robot.dir || !!r.hand || binsTotal(world) > 0 || world.built > 0; }
function resetWorld() { world = makeWorld(L); layout(); setMark(null); markBlock(null); syncButtons(); }

async function startRun(paused = false) {
  if (run.active) {
    run.paused = !run.paused;
    if (!run.paused && run.resume) { const r = run.resume; run.resume = null; r(); }
    syncButtons(); return;
  }
  $('#result').hidden = true;
  const code = getCode();
  resetWorld(); consoleClear();
  let ast;
  try { ast = parse(code); } catch (e) { showError(e); return; }
  if (!ast.length) { log('err', mode() === 'blk' ? 'Бағдарлама бос. Алдымен блок қос!' : 'Бағдарлама бос. Алдымен команда жаз!'); return; }
  Object.assign(run, { active: true, paused, stepOnce: false, cancelled: false, resume: null, line: null });
  run.attempts++;
  if (L.conveyor && ['If', 'While'].some((t) => L.concept.node === t || L.conveyor.hidden)) log('info', 'Кірпіштер түсі мен саны әр іске қосқанда өзгереді.');
  log('info', 'Бағдарлама іске қосылды…');
  syncButtons();
  const interp = new Interp(ast);
  try {
    await drive(interp.run());
    if (!run.cancelled) finish(ast, code);
  } catch (e) {
    if (e !== STOP) showError(e);
  } finally {
    run.active = false; run.paused = false; run.line = null;
    if (!markBad) { setMark(null); markBlock(null); }
    syncButtons();
  }
}
const STOP = { stop: true };
async function drive(gen) {
  let send, steps = 0;
  for (;;) {
    if (run.cancelled) throw STOP;
    const r = gen.next(send); send = undefined;
    if (r.done) return;
    const v = r.value;
    if (v.kind === 'line') {
      if (++steps > 200000) throw new PyError('Бағдарлама тым ұзақ жұмыс істеп тұр. Шексіз цикл болуы мүмкін: шарт қашан жалған болатынын тексер.', v.line);
      if (steps % 4000 === 0) await new Promise((res) => setTimeout(res));
      continue;
    }
    run.line = v.line;
    if (run.paused) { syncButtons(); await new Promise((res) => (run.resume = res)); }
    if (run.cancelled) throw STOP;
    try { send = await ACT[v.name](...v.args); }
    catch (e) { if (e instanceof RobotError) e.line = v.line; throw e; }
    if (run.stepOnce) { run.stepOnce = false; run.paused = true; syncButtons(); }
  }
}
function stopRun(silent) {
  if (run.active) { run.cancelled = true; if (run.resume) { const r = run.resume; run.resume = null; r(); } flushTweens(); if (!silent) log('info', 'Тоқтатылды.'); }
}
$('#runBtn').addEventListener('click', () => startRun());
$('#stepBtn').addEventListener('click', () => {
  if (!run.active) { startRun(true).catch(() => {}); setTimeout(() => { run.stepOnce = true; run.paused = false; if (run.resume) { const r = run.resume; run.resume = null; r(); } }, 0); return; }
  run.stepOnce = true; run.paused = false; if (run.resume) { const r = run.resume; run.resume = null; r(); } syncButtons();
});
$('#stopBtn').addEventListener('click', () => { stopRun(); setTimeout(() => { resetWorld(); $('#result').hidden = true; }, 0); });

function showError(e) {
  if (!(e instanceof PyError) && !(e instanceof RobotError)) { console.error(e); log('err', 'Күтпеген қате: ' + (e && e.message)); return; }
  const line = e.line;
  log('err', (line ? `${line}-жол: ` : '') + e.message);
  if (e instanceof PyError) { world.robot.alert = 1; SFX.err(); }
  if (line) { mode() === 'py' ? setMark(line, true) : markBlock(line, true); if (mode() === 'py') { const top = 12 + (line - 1) * 22; ta.scrollTop = Math.max(0, top - ta.clientHeight / 2); } }
}
function finish(ast, code) {
  const res = L.check(world);
  if (!res.ok) { log('err', res.msg); world.robot.alert = 1; SFX.err(); return; }
  const lines = countLines(code);
  const s2 = lines <= L.par;
  const s3 = L.concept.firstTry ? run.attempts === 1 : astHas(ast, L.concept.node);
  const stars = 1 + (s2 ? 1 : 0) + (s3 ? 1 : 0);
  save.stars[levelIndex] = Math.max(save.stars[levelIndex] || 0, stars); persist(); renderNav();
  log('ok', `Тамаша! Деңгей өтілді. Жол саны: ${lines}.`);
  bubble('Жасадық!', 2000); SFX.win(); confetti();
  $('#resStars').innerHTML = [0, 1, 2].map((k) => `<span class="${k < stars ? 'on' : ''}">★</span>`).join('');
  const crit = starCriteria(); const ok = [true, s2, s3];
  $('#resCrit').innerHTML = crit.map((c, k) => `<li class="${ok[k] ? 'on' : ''}">${esc(c)}${k === 1 ? ` (сенде ${lines})` : ''}</li>`).join('');
  $('#resNext').textContent = levelIndex === LEVELS.length - 1 ? 'Бірінші деңгейге →' : 'Келесі деңгей →';
  $('#resTitle').textContent = stars === 3 ? 'Мінсіз инженер!' : 'Деңгей өтілді!';
  setTimeout(() => { $('#result').hidden = false; }, 700 / Math.min(SPEED, 2));
}

/* test hook for automated checks */
window.CodeFactory = { LEVELS, loadLevel, startRun, setSpeed: (s) => (SPEED = s), state: () => ({ run, world, stars: save.stars }), setCode: (c) => { ta.value = c; refreshEditor(); }, setMode };

/* boot */
syncSound();
syncGfx();
$('#speed').value = 1;
loadLevel(Math.min(save.level || 0, LEVELS.length - 1));
setMode(save.mode === 'blk' ? 'blk' : 'py');
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
